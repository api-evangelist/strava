aid: strava
name: Strava
description: 'Strava is a popular fitness tracking app and social network that allows
  athletes to track and analyze workouts including running, cycling, swimming, and
  200+ other sport types. The Strava API enables developers to access athlete profiles,
  activities, segments, routes, clubs, gear, and time-series data streams. OAuth 2.0
  is used for authentication with granular scope control. Rate limits apply: 100 requests
  per 15 minutes, 1000 per day.'
