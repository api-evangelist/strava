apis:
- aid: strava:strava
  name: Strava API
  description: The Strava API provides access to athlete profiles, activities (workouts),
    segments, routes, clubs, gear, and time-series data streams. Supports OAuth 2.0
    with fine-grained scopes for reading activities, accessing private data, and writing
    updates. Rate limited to 100 requests/15 min and 1000 requests/day for default
    applications.
