description: >-
  Strava is a popular fitness tracking app and social network that allows users to
  track and analyze their workouts, including running, cycling, and other activities.
  Users can record their routes, distance, pace, and other metrics, and then share
  their workouts with friends and followers. Strava also provides features like leaderboards,
  challenges, and training plans to help users stay motivated and reach their fitness
  goals.
