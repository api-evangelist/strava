  city: String
  state: String
  country: String
  private: Boolean!
  hazardous: Boolean
  starred: Boolean
  createdAt: DateTime
  updatedAt: DateTime
  totalElevationGain: Float
  map: Map
  effortCount: Int
  athleteCount: Int
  starCount: Int
  athleteSegmentStats: AthletePR
  komRecord: KOMRecord
  resourceState: ResourceState
}

type SegmentLeaderboardEntry {
  athleteName: String!
  athleteId: ID!
  athleteGender: Gender
  averageHr: Float
  averageWatts: Float
  distance: Float!
