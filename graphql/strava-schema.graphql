# ─── Input Types ──────────────────────────────────────────────────────────────

input CreateActivityInput {
  name: String!
  type: SportType!
  sportType: SportType
  startDateLocal: DateTime!
  elapsedTime: Int!
  description: String
  distance: Float
  trainer: Boolean
  commute: Boolean
}

input UpdateActivityInput {
  commute: Boolean
  trainer: Boolean
  hideFromHome: Boolean
  description: String
  name: String
  type: SportType
  sportType: SportType
  gearId: String
}

input UpdateAthleteInput {
  weight: Float
  city: String
  state: String
  country: String
  sex: Gender
}

input CreateGearInput {
  name: String!
  primary: Boolean
  brandName: String
  modelName: String
  description: String
}

input UpdateGearInput {
  name: String
  primary: Boolean
  brandName: String
  modelName: String
  description: String
}

input UploadActivityInput {
  file: String!
  name: String
  description: String
  trainer: Boolean
  commute: Boolean
  dataType: UploadDataType!
  externalId: String
}

input CreateWebhookInput {
  callbackUrl: String!
  verifyToken: String!
}

# ─── Root Types ───────────────────────────────────────────────────────────────

type Query {
  # Athlete
  athlete: Athlete
  athleteById(id: ID!): AthleteProfile
  athleteStats(athleteId: ID!): ActivityStats!
  athleteZones: AthleteZones!
  athleteFollowers(athleteId: ID!, page: Int, perPage: Int): [FollowerSummary!]!
  athleteFriends(athleteId: ID!, page: Int, perPage: Int): [FollowerSummary!]!
  followerStats: FollowerStats!

  # Activities
  activity(id: ID!): Activity
  athleteActivities(before: Int, after: Int, page: Int, perPage: Int): [Activity!]!
  activityLaps(activityId: ID!): [ActivityLap!]!
  activityZones(activityId: ID!): [ActivityZone!]!
  activityComments(activityId: ID!, page: Int, perPage: Int): [Comment!]!
  activityKudoers(activityId: ID!, page: Int, perPage: Int): [AthleteProfile!]!
  activityPhotos(activityId: ID!, size: Int, photosOnly: Boolean): [Photo!]!
  relatedActivities(activityId: ID!): [Activity!]!

  # Segments
  segment(id: ID!): Segment
  starredSegments(page: Int, perPage: Int): [StarredSegment!]!
  segmentLeaderboard(
    segmentId: ID!
    gender: Gender
    ageGroup: String
    weightClass: String
    following: Boolean
    clubId: ID
    dateRange: String
    contextEntries: Int
    page: Int
    perPage: Int
  ): SegmentLeaderboard!
  segmentEfforts(
    segmentId: ID!
    athleteId: ID
    startDateLocal: DateTime
    endDateLocal: DateTime
    perPage: Int
  ): [ActivitySegmentEffort!]!
  exploreSegments(
    bounds: [Float!]!
    activityType: ActivityType
    minCat: Int
    maxCat: Int
  ): [Segment!]!
  segmentPR(segmentId: ID!, athleteId: ID!): SegmentPR

  # Routes
  route(id: ID!): Route
  athleteRoutes(athleteId: ID!, page: Int, perPage: Int): [Route!]!

  # Clubs
  club(id: ID!): Club
  athleteClubs: [Club!]!
  clubMembers(clubId: ID!, page: Int, perPage: Int): [ClubMember!]!
  clubActivities(clubId: ID!, page: Int, perPage: Int): ClubActivities!
  clubAdmins(clubId: ID!, page: Int, perPage: Int): [AthleteProfile!]!
  clubAnnouncements(clubId: ID!): [ClubAnnouncement!]!

  # Gear
  gear(id: ID!): Gear

  # Streams
  activityStreams(activityId: ID!, keys: [StreamType!]!, keyByType: Boolean): StreamSet!
  segmentEffortStreams(effortId: ID!, keys: [StreamType!]!, keyByType: Boolean): StreamSet!
  routeStreams(routeId: ID!): StreamSet!

  # Uploads
  upload(uploadId: ID!): UploadStatus

  # Webhooks
  webhooks: [Webhook!]!

  # Analytics
  analyticsSegment(segmentId: ID!): AnalyticsSegment
}

type Mutation {
  # Activities
  createActivity(input: CreateActivityInput!): Activity!
  updateActivity(id: ID!, input: UpdateActivityInput!): Activity!
  deleteActivity(id: ID!): Boolean!

  # Kudos
  createKudos(activityId: ID!): Boolean!

  # Comments
  createComment(activityId: ID!, text: String!): Comment!
  deleteComment(activityId: ID!, commentId: ID!): Boolean!

  # Segments
  starSegment(segmentId: ID!): StarredSegment!
  unstarSegment(segmentId: ID!): Boolean!

  # Athlete
  updateAthlete(input: UpdateAthleteInput!): Athlete!

  # Gear
  createGear(input: CreateGearInput!): Gear!
  updateGear(id: ID!, input: UpdateGearInput!): Gear!

  # Uploads
  uploadActivity(input: UploadActivityInput!): Upload!

  # Webhooks
  createWebhook(input: CreateWebhookInput!): Webhook!
  deleteWebhook(subscriptionId: ID!): Boolean!
}
