# Strava GraphQL Schema
# Conceptual schema derived from the Strava REST API
# REST Base: https://www.strava.com/api/v3
# Docs: https://developers.strava.com/docs/reference/

# ─── Scalars ─────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar Float
scalar JSON

# ─── Enums ───────────────────────────────────────────────────────────────────

enum SportType {
  ALPINE_SKI
  BACKCOUNTRY_SKI
  CANOEING
  CROSSFIT
  E_BIKE_RIDE
  ELLIPTICAL
  GOLF
  HANDCYCLE
  HIKE
  ICE_SKATE
  INLINE_SKATE
  KAYAKING
  KITESURF
  NORDIC_SKI
  RIDE
  ROCK_CLIMBING
  ROLLER_SKI
  ROWING
  RUN
  SAIL
  SKATEBOARD
  SNOWBOARD
  SNOWSHOE
  SOCCER
  STAIR_STEPPER
  STAND_UP_PADDLING
  SURFING
  SWIM
  TRAIL_RUN
  VELOMOBILE
  VIRTUAL_RIDE
  VIRTUAL_RUN
  WALK
  WEIGHT_TRAINING
  WHEELCHAIR
  WINDSURF
  WORKOUT
  YOGA
}

enum ResourceState {
  SUMMARY
  DETAIL
  META
}

enum FollowingStatus {
  PENDING
  ACCEPTED
  BLOCKED
}

enum ClubType {
  CASUAL_CLUB
  RACING_TEAM
  SHOP
  COMPANY
  OTHER
}

enum SportCategory {
  CYCLING
  RUNNING
  TRIATHLON
  OTHER
}

enum RouteType {
  RIDE
  RUN
}

enum UploadDataType {
  FIT
  FIT_GZ
  TCX
  TCX_GZ
  GPX
  GPX_GZ
}

enum WebhookAspect {
  CREATE
  UPDATE
  DELETE
}

enum WebhookObjectType {
  ACTIVITY
  ATHLETE
}

enum StreamType {
  TIME
  DISTANCE
  LATLNG
  ALTITUDE
  VELOCITY_SMOOTH
  HEARTRATE
  CADENCE
  WATTS
  TEMP
  MOVING
  GRADE_SMOOTH
}

enum MeasurementPreference {
  FEET
  METERS
}

enum Gender {
  MALE
  FEMALE
  NON_BINARY
}

enum ActivityType {
  RIDE
  RUN
  SWIM
  WALK
  HIKE
  WORKOUT
  OTHER
}

# ─── Location & Map Types ─────────────────────────────────────────────────────

type LatLng {
  lat: Float!
  lng: Float!
}

type Location {
  city: String
  state: String
  country: String
  coordinates: LatLng
}

type Elevation {
  value: Float!
  unit: String!
}

type ElevationSummary {
  totalElevationGain: Float
  totalElevationLoss: Float
  minElevation: Float
  maxElevation: Float
  unit: String
}

type PolyLine {
  encoded: String!
  decoded: [LatLng!]
}

type Map {
  id: ID!
  polyline: PolyLine
  summaryPolyline: PolyLine
  resourceState: ResourceState
}

# ─── Stream Types ─────────────────────────────────────────────────────────────

type StreamData {
  originalSize: Int!
  resolution: String
  seriesType: String
  data: [JSON]!
}

type Stream {
  type: StreamType!
  data: StreamData!
  seriesType: String
  originalSize: Int
  resolution: String
}

type StreamSet {
  activityId: ID
  streams: [Stream!]!
  time: Stream
  distance: Stream
  latlng: Stream
  altitude: Stream
  velocitySmooth: Stream
  heartrate: Stream
  cadence: Stream
  watts: Stream
  temp: Stream
  moving: Stream
  gradeSmooth: Stream
}

# ─── Zone Types ──────────────────────────────────────────────────────────────

type HeartRateZone {
  min: Int!
  max: Int!
  name: String
  order: Int
}

type PowerZone {
  min: Int!
  max: Int!
  name: String
  order: Int
}

type PaceZone {
  min: Float!
  max: Float!
  name: String
  order: Int
}

type ActivityZone {
  score: Int
  distributionBuckets: [ZoneBucket!]!
  type: String!
  sensorBased: Boolean
  points: Int
  customZones: Boolean
}

type ZoneBucket {
  min: Int!
  max: Int!
  time: Int!
}

type AthleteZones {
  heartRate: HeartRateZones!
  power: PowerZones!
}

type HeartRateZones {
  customZones: Boolean!
  zones: [HeartRateZone!]!
}

type PowerZones {
  zones: [PowerZone!]!
}

