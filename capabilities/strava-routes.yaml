naftiko: 1.0.0-alpha2
info:
  label: Strava API — Routes
  description: 'Strava API — Routes. 2 operations. Lead operation: List Athlete Routes. Self-contained Naftiko capability
    covering one Strava business surface.'
  tags:
  - Strava
  - Routes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STRAVA_API_KEY: STRAVA_API_KEY
capability:
  consumes:
  - type: http
    namespace: strava-routes
    baseUri: https://www.strava.com/api/v3
    description: Strava API — Routes business capability. Self-contained, no shared references.
    resources:
    - name: athlete-routes
      path: /athlete/routes
      operations:
      - name: getroutesbyathleteid
        method: GET
        description: List Athlete Routes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination
        - name: per_page
          in: query
          type: integer
          description: Number of items per page
    - name: routes-id
      path: /routes/{id}
      operations:
      - name: getroutebyid
        method: GET
        description: Get Route
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The identifier of the route
          required: true
    authentication:
      type: bearer
      token: '{{env.STRAVA_API_KEY}}'
  exposes:
  - type: rest
    namespace: strava-routes-rest
    port: 8080
    description: REST adapter for Strava API — Routes. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/athlete/routes
      name: athlete-routes
      description: REST surface for athlete-routes.
      operations:
      - method: GET
        name: getroutesbyathleteid
        description: List Athlete Routes
        call: strava-routes.getroutesbyathleteid
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/routes/{id}
      name: routes-id
      description: REST surface for routes-id.
      operations:
      - method: GET
        name: getroutebyid
        description: Get Route
        call: strava-routes.getroutebyid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: strava-routes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Strava API — Routes. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-athlete-routes
      description: List Athlete Routes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: strava-routes.getroutesbyathleteid
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-route
      description: Get Route
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: strava-routes.getroutebyid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
