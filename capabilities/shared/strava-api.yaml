naftiko: "1.0.0-alpha1"

info:
  label: "Strava API"
  description: >-
    Strava API for accessing athlete profiles, activities, segments, routes,
    clubs, gear, and time-series data streams. OAuth 2.0 authentication with
    scope-based access control.
  tags:
    - Cycling
    - Fitness
    - Fitness Tracking
    - Running
    - Sports
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STRAVA_ACCESS_TOKEN: STRAVA_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: strava
      baseUri: https://www.strava.com/api/v3
      description: "Strava API v3"
      authentication:
        type: bearer
        token: "{{STRAVA_ACCESS_TOKEN}}"
      resources:
        - name: athlete
          path: /athlete
          description: "Authenticated athlete profile"
          operations:
            - name: get-logged-in-athlete
              method: GET
              description: "Get the authenticated athlete's profile"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: athlete-stats
          path: /athletes/{id}/stats
          description: "Athlete statistics"
          operations:
            - name: get-athlete-stats
              method: GET
              description: "Get year-to-date and all-time activity statistics"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "The athlete's identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: athlete-zones
          path: /athlete/zones
          description: "Athlete heart rate and power zones"
          operations:
            - name: get-logged-in-athlete-zones
              method: GET
              description: "Get the athlete's heart rate and power zones"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: athlete-activities
          path: /athlete/activities
          description: "Athlete activity list"
          operations:
            - name: get-logged-in-athlete-activities
              method: GET
              description: "List the authenticated athlete's activities"
              inputParameters:
                - name: before
                  in: query
                  type: integer
                  required: false
                  description: "Unix timestamp to filter activities before"
                - name: after
                  in: query
                  type: integer
                  required: false
                  description: "Unix timestamp to filter activities after"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page (max 200)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: activity
          path: /activities/{id}
          description: "Individual activity operations"
          operations:
            - name: get-activity-by-id
              method: GET
              description: "Get a specific activity by ID"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "The activity identifier"
                - name: include_all_efforts
                  in: query
                  type: boolean
                  required: false
                  description: "Include all segment efforts"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: activity-streams
          path: /activities/{id}/streams
          description: "Activity time-series data streams"
          operations:
            - name: get-activity-streams
              method: GET
              description: "Get time-series data streams for an activity"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "The activity identifier"
                - name: keys
                  in: query
                  type: array
                  required: true
                  description: "Stream types (time, latlng, distance, altitude, heartrate, cadence, watts, velocity_smooth, grade_smooth)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: activity-laps
          path: /activities/{id}/laps
          description: "Activity lap data"
          operations:
            - name: get-laps-by-activity-id
              method: GET
              description: "Get lap splits for an activity"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "The activity identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: segment
          path: /segments/{id}
          description: "Individual segment data"
          operations:
            - name: get-segment-by-id
              method: GET
              description: "Get a specific segment by ID"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "The segment identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: segment-leaderboard
          path: /segments/{id}/leaderboard
          description: "Segment leaderboard"
          operations:
            - name: get-leaderboard-by-segment-id
              method: GET
              description: "Get the leaderboard for a segment"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "The segment identifier"
                - name: gender
                  in: query
                  type: string
                  required: false
                  description: "Filter by gender (M or F)"
                - name: following
                  in: query
                  type: boolean
                  required: false
                  description: "Limit to followed athletes"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: starred-segments
          path: /segments/starred
          description: "Athlete's starred segments"
          operations:
            - name: get-logged-in-athlete-starred-segments
              method: GET
              description: "List the authenticated athlete's starred segments"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: athlete-routes
          path: /athlete/routes
          description: "Athlete routes"
          operations:
            - name: get-routes-by-athlete-id
              method: GET
              description: "List the athlete's routes"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: athlete-clubs
          path: /athlete/clubs
          description: "Athlete club memberships"
          operations:
            - name: get-logged-in-athlete-clubs
              method: GET
              description: "List the athlete's club memberships"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: gear
          path: /gear/{id}
          description: "Athlete gear details"
          operations:
            - name: get-gear-by-id
              method: GET
              description: "Get an equipment item by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The gear identifier (e.g., b1234567)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: strava-rest-api
      resources:
        - path: /v1/athlete
          name: athlete
          description: "Athlete profile"
          operations:
            - method: GET
              name: get-athlete
              description: "Get authenticated athlete profile"
              call: "strava.get-logged-in-athlete"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/activities
          name: activities
          description: "Activity list"
          operations:
            - method: GET
              name: list-activities
              description: "List athlete activities"
              call: "strava.get-logged-in-athlete-activities"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/activities/{id}
          name: activity
          description: "Single activity"
          operations:
            - method: GET
              name: get-activity
              description: "Get an activity"
              call: "strava.get-activity-by-id"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/segments/{id}/leaderboard
          name: segment-leaderboard
          description: "Segment leaderboard"
          operations:
            - method: GET
              name: get-leaderboard
              description: "Get segment leaderboard"
              call: "strava.get-leaderboard-by-segment-id"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: strava-mcp
      transport: http
      tools:
        - name: get-athlete-profile
          description: "Get the authenticated athlete's profile"
          hints:
            readOnly: true
          call: "strava.get-logged-in-athlete"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-athlete-stats
          description: "Get the athlete's year-to-date and all-time statistics"
          hints:
            readOnly: true
          call: "strava.get-athlete-stats"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-activities
          description: "List the athlete's activities with optional date filtering"
          hints:
            readOnly: true
            openWorld: true
          call: "strava.get-logged-in-athlete-activities"
          with:
            before: "tools.before"
            after: "tools.after"
            page: "tools.page"
            per_page: "tools.per_page"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-activity
          description: "Get detailed information about a specific activity"
          hints:
            readOnly: true
          call: "strava.get-activity-by-id"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-activity-streams
          description: "Get time-series data streams (GPS, heart rate, power, etc.) for an activity"
          hints:
            readOnly: true
          call: "strava.get-activity-streams"
          with:
            id: "tools.id"
            keys: "tools.keys"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-activity-laps
          description: "Get lap splits for a specific activity"
          hints:
            readOnly: true
          call: "strava.get-laps-by-activity-id"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-segment
          description: "Get details about a specific Strava segment"
          hints:
            readOnly: true
          call: "strava.get-segment-by-id"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-segment-leaderboard
          description: "Get the leaderboard for a segment with optional filters"
          hints:
            readOnly: true
            openWorld: true
          call: "strava.get-leaderboard-by-segment-id"
          with:
            id: "tools.id"
            gender: "tools.gender"
            following: "tools.following"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-starred-segments
          description: "List the athlete's starred segments"
          hints:
            readOnly: true
          call: "strava.get-logged-in-athlete-starred-segments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-routes
          description: "List the athlete's routes"
          hints:
            readOnly: true
          call: "strava.get-routes-by-athlete-id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-clubs
          description: "List the athlete's club memberships"
          hints:
            readOnly: true
          call: "strava.get-logged-in-athlete-clubs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-gear
          description: "Get details about a specific piece of gear (bike or shoes)"
          hints:
            readOnly: true
          call: "strava.get-gear-by-id"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
